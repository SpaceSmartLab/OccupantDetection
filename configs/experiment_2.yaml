input_video: 'C:\Users\w0102\OneDrive\바탕 화면\cctv 샘플영상\원본.mp4'
output_root: outputs/experiment_2_20260803

detectors:
  enabled:
    - yolo11s
  common:
    confidence_threshold: 0.70
    person_class_id: 0
    image_size: 640
    device: cpu
  yolo11s:
    checkpoint: yolo11s.pt
    nms_iou_threshold: 0.70

tracker:
  type: bytetrack
  track_activation_threshold: 0.25
  lost_track_buffer: 30
  minimum_matching_threshold: 0.80

occupancy:
  roi:
    # Office interior: excludes the upper wall/ceiling wedge while retaining
    # seated workers and people entering at the left and right frame edges.
    polygon:
      - [0.00, 0.25]
      - [0.18, 0.16]
      - [0.82, 0.16]
      - [1.00, 0.25]
      - [1.00, 1.00]
      - [0.00, 1.00]
    anchor: bottom_center
  background_gate:
    enabled: true
    # The first two seconds of this video are a known-empty office scene.
    initialization_frames: 50
    blur_kernel_size: 5
    pixel_difference_threshold: 25
    minimum_changed_pixel_ratio: 0.20
    # Previously approved people bypass the background test when stationary.
    approved_track_iou_threshold: 0.30
  temporal:
    enter_confirm_sec: 0.50
    exit_confirm_sec: 1.00
    state_retention_sec: 2.00

output:
  video_codec: mp4v
  draw_confidence: true
  save_video: true
  save_frame_csv: true

runtime:
  warmup_iterations: 3
  max_frames: null
  progress_every_frames: 500
  max_consecutive_decode_errors: 3
  max_total_decode_errors: 100
